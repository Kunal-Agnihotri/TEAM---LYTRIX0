<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Bridge - Farmer</title>
<!-- =========================
         PROFESSIONAL FONT
    ========================== -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>

        /* =====================================================
           COLOURS
        ===================================================== */

        :root {

            --orange: #f6b84a;
            --orange-light: #ffd987;

            --cream: #fff9dc;
            --cream-light: #fffce9;

            --green: #789b55;
            --green-dark: #628543;
            --green-light: #b8cd91;

            --text: #566b49;

        }


        /* =====================================================
           RESET
        ===================================================== */

        * {

            margin: 0;
            padding: 0;

            box-sizing: border-box;

        }


        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

        }


        body {

            font-family:
                "Inter",
                Arial,
                sans-serif;

            background:
                var(--cream);

        }


        /* =====================================================
           FULL SCREEN
           NO OUTER YELLOW BORDER
        ===================================================== */

        .bridge-frame {

            width: 100vw;
            height: 100vh;

            padding: 0;

            background:
                var(--cream);

            position: relative;

            overflow: hidden;

        }


        /* =====================================================
           APP
        ===================================================== */

        .app {

            width: 100%;
            height: 100%;

            background:
                var(--cream);

            border-radius: 0;

            overflow: hidden;

            position: relative;

        }


        /* =====================================================
           TOP BAR
        ===================================================== */

        .topbar {

            width: 100%;
            height: 78px;

            padding: 0 30px;

            background:
                var(--cream-light);

            display: flex;

            align-items: center;

            border-bottom:
                1px solid
                rgba(98, 133, 67, 0.10);

        }


        /* =====================================================
           BRIDGE NAME
        ===================================================== */

        .bridge-name {

            font-family:
                "Inter",
                Arial,
                sans-serif;

            font-size: 28px;

            font-weight: 700;

            letter-spacing: -0.8px;

            color:
                var(--green-dark);

        }


        /* =====================================================
           TOP RIGHT ICONS
        ===================================================== */

        .top-icons {

            margin-left: auto;

            display: flex;

            align-items: center;

            gap: 10px;

        }


        .top-icon {

            width: 36px;
            height: 36px;

            border: none;

            background: transparent;

            color:
                var(--green-dark);

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            border-radius: 50%;

            position: relative;

            transition:
                background 0.2s ease,
                transform 0.2s ease;

        }


        .top-icon:hover {

            background:
                rgba(120, 155, 85, 0.10);

            transform:
                translateY(-1px);

        }


        .top-icon svg {

            width: 20px;
            height: 20px;

            stroke:
                currentColor;

            fill: none;

            stroke-width: 1.8;

            stroke-linecap: round;

            stroke-linejoin: round;

        }



        /* =====================================================
           PROFILE
        ===================================================== */

        .profile {

            width: 40px;
            height: 40px;

            border-radius: 50%;

            border: none;

            background:
                var(--green);

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            margin-left: 3px;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;

        }


        .profile:hover {

            transform:
                translateY(-1px);

            box-shadow:
                0 4px 10px
                rgba(98, 133, 67, 0.20);

        }


        .profile svg {

            width: 21px;
            height: 21px;

            stroke: white;

            fill: none;

            stroke-width: 1.8;

            stroke-linecap: round;

            stroke-linejoin: round;

        }


        /* =====================================================
           MAIN
        ===================================================== */

        .main {

            position: relative;

            width: 100%;

            height:
                calc(100% - 78px);

            background:
                var(--cream);

            overflow: hidden;

        }


        /* =====================================================
           MAIN PANEL
        ===================================================== */

        .main-panel {

            position: absolute;

            left: 18px;
            right: 18px;

            top: 24px;
            bottom: 18px;

            border-radius: 24px;

            background:
                var(--cream-light);

            border:
                1px solid
                rgba(98, 133, 67, 0.12);

            box-shadow:
                inset 0 0 0 1px
                rgba(255,255,255,0.25);

        }


        /* =====================================================
           START MESSAGE
        ===================================================== */

        .start-message {

            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            width: 300px;

            min-height: 135px;

            border-radius: 20px;

            background:
                var(--green-light);

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 20px;

            box-shadow:
                0 8px 20px
                rgba(90, 110, 60, 0.08);

        }


        .start-message h1 {

            font-family:
                "Inter",
                Arial,
                sans-serif;

            font-size: 27px;

            line-height: 1.3;

            font-weight: 500;

            letter-spacing: -0.5px;

            color: white;

        }


        /* =====================================================
           MENU TAB
        ===================================================== */

        .menu-tab {

            position: absolute;

            left: 0;

            top: 50%;

            transform:
                translateY(-50%);

            width: 40px;
            height: 105px;

            background:
                var(--orange);

            border: none;

            border-radius:
                0 12px 12px 0;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            z-index: 15;

            box-shadow:
                3px 3px 10px
                rgba(190, 120, 20, 0.10);

        }


        .menu-tab svg {

            width: 20px;
            height: 20px;

            stroke: white;

            fill: none;

            stroke-width: 2;

            stroke-linecap: round;

            stroke-linejoin: round;

        }


        /* =====================================================
           SIDE MENU
        ===================================================== */

        .side-menu {

            position: absolute;

            top: 0;
            left: 0;

            width: 235px;
            height: 100%;

            background:
                var(--orange);

            z-index: 30;

            padding:
                26px 16px;

            transform:
                translateX(-100%);

            transition:
                transform 0.28s ease;

            box-shadow:
                7px 0 24px
                rgba(150, 95, 10, 0.14);

        }


        .side-menu.open {

            transform:
                translateX(0);

        }


        /* =====================================================
           SIDE BRAND
        ===================================================== */

        .side-brand {

            font-family:
                "Inter",
                Arial,
                sans-serif;

            color: white;

            font-size: 25px;

            font-weight: 700;

            letter-spacing: -0.5px;

            margin:
                6px 14px 28px;

        }


        /* =====================================================
           MENU ITEMS
        ===================================================== */

        .menu-items {

            display: flex;

            flex-direction: column;

            gap: 4px;

        }


        .menu-item {

            height: 54px;

            width: 100%;

            border: none;

            border-radius: 11px;

            background: transparent;

            color: white;

            display: flex;

            align-items: center;

            gap: 14px;

            padding: 0 14px;

            font-family:
                "Inter",
                Arial,
                sans-serif;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            text-align: left;

            transition:
                background 0.2s ease;

        }


        .menu-item:hover {

            background:
                rgba(255,255,255,0.20);

        }


        .menu-item.active {

            background:
                rgba(255,255,255,0.28);

        }


        .menu-item svg {

            width: 20px;
            height: 20px;

            stroke: white;

            fill: none;

            stroke-width: 1.8;

            stroke-linecap: round;

            stroke-linejoin: round;

            flex-shrink: 0;

        }


        /* =====================================================
           SEPARATOR
        ===================================================== */

        .menu-separator {

            height: 1px;

            background:
                rgba(255,255,255,0.35);

            margin:
                22px 8px;

        }


        /* =====================================================
           AI BUTTON
        ===================================================== */

        .ai-button {

            position: absolute;

            right: 24px;
            bottom: 20px;

            width: 78px;
            height: 88px;

            border: none;

            background: transparent;

            cursor: pointer;

            z-index: 10;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 3px;

        }


        .ai-circle {

            width: 54px;
            height: 54px;

            border-radius: 50%;

            background:
                var(--green);

            display: flex;

            align-items: center;

            justify-content: center;

            box-shadow:
                0 6px 14px
                rgba(80, 110, 50, 0.14);

        }


        .ai-circle svg {

            width: 29px;
            height: 29px;

            stroke: white;

            fill: none;

            stroke-width: 1.6;

            stroke-linecap: round;

            stroke-linejoin: round;

        }


        .ai-text {

            font-family:
                "Inter",
                Arial,
                sans-serif;

            color:
                var(--green-dark);

            font-size: 13px;

            font-weight: 600;

        }


        /* =====================================================
           AI COMPANION PANEL
        ===================================================== */

        .ai-panel {

            position: absolute;

            right: 20px;
            bottom: 18px;

            width: 330px;
            height: 430px;

            background:
                var(--cream-light);

            border:
                2px solid
                var(--orange);

            border-radius: 21px;

            z-index: 50;

            display: flex;

            flex-direction: column;

            overflow: hidden;

            opacity: 0;

            visibility: hidden;

            transform:
                translateY(18px);

            transition:
                0.24s ease;

            box-shadow:
                0 14px 32px
                rgba(100, 75, 20, 0.18);

        }


        .ai-panel.open {

            opacity: 1;

            visibility: visible;

            transform:
                translateY(0);

        }


        /* =====================================================
           AI HEADER
        ===================================================== */

        .ai-header {

            height: 60px;

            background:
                var(--orange);

            display: flex;

            align-items: center;

            padding:
                0 15px;

            color: white;

            flex-shrink: 0;

        }


        .ai-header-icon {

            width: 34px;
            height: 34px;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.23);

            display: flex;

            align-items: center;

            justify-content: center;

            margin-right: 9px;

        }


        .ai-header-icon svg {

            width: 21px;
            height: 21px;

            stroke: white;

            fill: none;

            stroke-width: 1.8;

            stroke-linecap: round;

            stroke-linejoin: round;

        }


        /* =====================================================
           AASHI TITLE
        ===================================================== */

        .ai-header-title {

            font-family:
                "Inter",
                Arial,
                sans-serif;

            font-size: 15px;

            font-weight: 700;

            white-space: nowrap;

        }


        /* =====================================================
           CLOSE BUTTON
        ===================================================== */

        .ai-close {

            margin-left: auto;

            border: none;

            background: transparent;

            color: white;

            font-size: 24px;

            cursor: pointer;

            line-height: 1;

            padding: 2px 3px;

        }


        /* =====================================================
           EMPTY CHAT AREA
           
           No first message anymore.
        ===================================================== */

        .chat {

            flex: 1;

            padding: 15px;

            overflow-y: auto;

            display: flex;

            flex-direction: column;

            gap: 9px;

        }


        /* =====================================================
           FUTURE CHAT MESSAGES
        ===================================================== */

        .message {

            max-width: 82%;

            padding:
                10px 13px;

            font-family:
                "Inter",
                Arial,
                sans-serif;

            font-size: 12px;

            line-height: 1.45;

        }


        .ai-message {

            align-self:
                flex-start;

            background:
                var(--green-light);

            color:
                var(--green-dark);

            border-radius:
                14px 14px 14px 4px;

        }


        .user-message {

            align-self:
                flex-end;

            background:
                var(--orange-light);

            color:
                #765923;

            border-radius:
                14px 14px 4px 14px;

        }


        /* =====================================================
           CHAT INPUT AREA
        ===================================================== */

        .chat-input-area {

            display: flex;

            align-items: center;

            gap: 6px;

            padding: 10px;

            border-top:
                1px solid
                #f0dfae;

            background:
                #fffdf1;

            flex-shrink: 0;

        }


        /* =====================================================
           MICROPHONE
        ===================================================== */

        .mic {

            width: 39px;
            height: 39px;

            border: none;

            border-radius: 50%;

            background:
                var(--green-light);

            color:
                var(--green-dark);

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

        }


        .mic svg {

            width: 18px;
            height: 18px;

            stroke:
                currentColor;

            fill: none;

            stroke-width: 1.9;

            stroke-linecap: round;

            stroke-linejoin: round;

        }


        /* =====================================================
           CHAT TEXT BOX
        ===================================================== */

        .chat-input {

            flex: 1;

            height: 39px;

            border:
                1px solid
                #d9dfc7;

            border-radius: 11px;

            padding:
                0 11px;

            outline: none;

            font-family:
                "Inter",
                Arial,
                sans-serif;

            font-size: 12px;

            color:
                var(--text);

            background:
                white;

        }


        .chat-input:focus {

            border-color:
                var(--green-light);

        }


        /* =====================================================
           SEND BUTTON
        ===================================================== */

        .send {

            width: 39px;
            height: 39px;

            border: none;

            border-radius: 11px;

            background:
                var(--green);

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

        }


        .send svg {

            width: 17px;
            height: 17px;

            stroke: white;

            fill: none;

            stroke-width: 1.8;

            stroke-linecap: round;

            stroke-linejoin: round;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .topbar {

                height: 68px;

                padding:
                    0 12px;

            }


            .main {

                height:
                    calc(100% - 68px);

            }


            .bridge-name {

                font-size: 23px;

            }


            .top-icon:nth-child(1),
            .top-icon:nth-child(2) {

                display: none;

            }


            .top-icon {

                width: 36px;
                height: 36px;

            }


            .profile {

                width: 39px;
                height: 39px;

            }


            .main-panel {

                top: 12px;

                left: 9px;

                right: 9px;

                bottom: 9px;

            }


            .start-message {

                width: 230px;

                min-height: 110px;

            }


            .start-message h1 {

                font-size: 23px;

            }


            .ai-button {

                right: 8px;

                bottom: 8px;

            }


            .ai-panel {

                left: 12px;

                right: 12px;

                bottom: 14px;

                width: auto;

            }


            .ai-header-title {

                font-size: 14px;

            }

        }

    
/* NOTIFICATIONS POPUP */
.notification-overlay{
    position:fixed;
    inset:0;
    z-index:80;
    display:flex;
    justify-content:flex-end;
    align-items:flex-start;
    padding:88px 28px 28px;
    background:rgba(63,76,52,.10);
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:.2s ease;
}

.notification-overlay.open{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
}

.notification-panel{
    width:390px;
    max-width:calc(100vw - 36px);
    max-height:calc(100vh - 115px);
    overflow:hidden;
    border-radius:18px;
    background:var(--cream-light);
    border:1px solid rgba(98,133,67,.15);
    box-shadow:0 14px 35px rgba(70,85,55,.20);
    transform:translateY(-8px);
    transition:.2s ease;
}

.notification-overlay.open .notification-panel{
    transform:translateY(0);
}

.notification-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:18px 19px;
    background:var(--orange);
    color:white;
}

.notification-header h2{
    font-size:18px;
    font-weight:700;
}

.notification-header p{
    margin-top:4px;
    font-size:11px;
    opacity:.9;
}

.notification-close{
    width:32px;
    height:32px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.20);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

.notification-close:hover{
    background:rgba(255,255,255,.32);
}

.notification-close svg{
    width:17px;
    height:17px;
    fill:none;
    stroke:white;
    stroke-width:2;
    stroke-linecap:round;
}

.notification-list{
    max-height:calc(100vh - 210px);
    overflow-y:auto;
    padding:7px 0;
}

.notification-item{
    display:flex;
    gap:12px;
    padding:16px 18px;
    border-bottom:1px solid rgba(98,133,67,.09);
}

.notification-item:last-child{
    border-bottom:0;
}

.notification-dot{
    width:8px;
    height:8px;
    margin-top:6px;
    flex-shrink:0;
    border-radius:50%;
    background:var(--green);
}

.notification-item h3{
    color:var(--green-dark);
    font-size:13px;
    font-weight:700;
}

.notification-item p{
    margin-top:5px;
    color:var(--muted);
    font-size:11px;
    line-height:1.45;
}

.notification-item span{
    display:block;
    margin-top:7px;
    color:#9aa58f;
    font-size:10px;
}

.notification-item.old{
    opacity:.78;
}

</style>
</head>
<body>
<!-- =====================================================
         FULL SCREEN BRIDGE
    ====================================================== -->
<div class="bridge-frame">
<div class="app">
<!-- =================================================
                 TOP BAR
            ================================================== -->
<header class="topbar">
<div class="bridge-name">

                    Bridge

                </div>
<div class="top-icons">
<!-- =========================================
                         BASKET
                    ========================================== -->

</path>
</svg>
</button>

</svg>
</button>
</div>
</header>
<!-- =================================================
                 MAIN CONTENT
            ================================================== -->

                     MAIN PANEL

</div>

</svg>
</button>
<!-- =============================================
                     SIDE MENU
                ============================================== -->

<div class="side-brand">

                        Bridge

                    </div>
<div class="menu-items">

                            Home

                            Market

<button class="menu-item" onclick="window.location.href='farmerspage_help.html'">
<svg viewbox="0 0 24 24">

<path d="M9.7 9a2.4 2.4 0 014.6 1c0 1.7-2.3 2-2.3 3.4">

                            Help


                        </button>
</div>
<div class="menu-separator"></div>
<!-- LOGOUT -->
<button class="menu-item" id="logoutButton">
<svg viewbox="0 0 24 24">
<path d="M4 4h8v16H4z">
</path>
<path d="M11 12h9">
</path>
<path d="M16 8l4 4-4 4">

</svg>


                        Logout


                    </button>
</aside>
<!-- =============================================
                     AI BUTTON
                ============================================== -->
<button class="ai-button" id="aiButton" title="Aashi - Your AI Companion">
<div class="ai-circle">
<svg viewbox="0 0 24 24">
<circle cx="12" cy="12" r="8">
</circle>
<circle cx="9" cy="10" r="1">
</circle>
<circle cx="15" cy="10" r="1">

<path d="M8.5 14.5c1.8 1.8 5.2 1.8 7 0">
</path>
<path d="M12 4V2">
</path>
</svg>
</div>
<span class="ai-text">

                        AI

                    </span>
</button>
<!-- =============================================
                     AASHI AI COMPANION
                ============================================== -->
<section class="ai-panel" id="aiPanel">
<!-- =========================================
                         AI HEADER

<script>

        /*
            LOGIN / LOGOUT FLOW

            The login page sets farmerLoggedIn before opening this page.
            We intentionally do not block direct preview of this file,
            because many HTML preview tools run each file in isolation.
            Real authentication should be enforced by the backend.
        */


        /* =====================================================
           SIDE MENU
        ===================================================== */

        const menuTab =
            document.getElementById("menuTab");

        const sideMenu =
            document.getElementById("sideMenu");


        menuTab.addEventListener(
            "click",
            function () {

                sideMenu.classList.toggle(
                    "open"
                );

            }
        );



        /* =====================================================
           CLOSE MENU WHEN CLICKING OUTSIDE
        ===================================================== */

        document.addEventListener(
            "click",
            function (event) {


                if (

                    sideMenu.classList.contains("open")

                    &&

                    !sideMenu.contains(event.target)

                    &&

                    !menuTab.contains(event.target)

                ) {


                    sideMenu.classList.remove(
                        "open"
                    );


                }

            }
        );



        /* =====================================================
           AASHI AI COMPANION
           
           For now this ONLY opens and closes
           the interface.

           Your actual AI code can be integrated later.
        ===================================================== */

        const aiButton =
            document.getElementById("aiButton");

        const aiPanel =
            document.getElementById("aiPanel");

        const aiClose =
            document.getElementById("aiClose");


        /* OPEN AASHI */

        aiButton.addEventListener(
            "click",
            function () {

                aiPanel.classList.add(
                    "open"
                );

            }
        );


        /* CLOSE AASHI */

        aiClose.addEventListener(
            "click",
            function () {

                aiPanel.classList.remove(
                    "open"
                );

            }
        );



        /* =====================================================
           CHAT ELEMENTS
           
           Kept ready for your AI integration.
        ===================================================== */

        const chat =
            document.getElementById("chat");

        const chatInput =
            document.getElementById("chatInput");

        const sendButton =
            document.getElementById("sendButton");



        /* =====================================================
           TEMPORARY SEND FUNCTION
           
           This DOES NOT connect to an AI.
           
           It simply demonstrates that the box works.
           
           You can replace this entire function with
           your own Aashi AI code later.
        ===================================================== */

        function sendMessage() {


            const text =
                chatInput.value.trim();


            if (!text) {

                return;

            }


            /* USER MESSAGE */

            const userMessage =
                document.createElement("div");


            userMessage.className =
                "message user-message";


            userMessage.textContent =
                text;


            chat.appendChild(
                userMessage
            );


            chatInput.value =
                "";


            chat.scrollTop =
                chat.scrollHeight;

        }



        /* SEND BUTTON */

        sendButton.addEventListener(
            "click",
            sendMessage
        );



        /* ENTER KEY */

        chatInput.addEventListener(
            "keydown",
            function (event) {


                if (
                    event.key === "Enter"
                ) {

                    sendMessage();

                }

            }
        );



        /* =====================================================
           LOGOUT
        ===================================================== */

        const logoutButton =
            document.getElementById("logoutButton");


        logoutButton.addEventListener(
            "click",
            function () {

                sessionStorage.removeItem(
                    "farmerLoggedIn"
                );

                window.location.replace(
                    "login.html"
                );

            }
        );


        /* =====================================================
           MENU ACTIVE STATE
        ===================================================== */

        const menuItems =
            document.querySelectorAll(
                ".menu-item"
            );


        menuItems.forEach(
            function (item) {


                item.addEventListener(
                    "click",
                    function () {


                        menuItems.forEach(
                            function (other) {

                                other.classList.remove(
                                    "active"
                                );

                            }
                        );


                        /* Don't highlight Logout */

                        if (
                            !item.textContent
                                .trim()
                                .includes("Logout")
                        ) {


                            item.classList.add(
                                "active"
                            );


                        }

                    }
                );


            }
        );


    
/* NOTIFICATIONS */
const notificationButton = document.getElementById("notificationButton");
const notificationOverlay = document.getElementById("notificationOverlay");
const closeNotifications = document.getElementById("closeNotifications");

if(notificationButton){
    notificationButton.addEventListener("click", function(event){
        event.stopPropagation();
        notificationOverlay.classList.add("open");
    });
}

if(closeNotifications){
    closeNotifications.addEventListener("click", function(){
        notificationOverlay.classList.remove("open");
    });
}

if(notificationOverlay){
    notificationOverlay.addEventListener("click", function(event){
        if(event.target === notificationOverlay){
            notificationOverlay.classList.remove("open");
        }
    });
}

document.addEventListener("keydown", function(event){
    if(event.key === "Escape" && notificationOverlay){
        notificationOverlay.classList.remove("open");
    }
});

</script>
